name: Feature request
description: Propose a protocol, adapter, renderer, or developer-experience improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the deployment or playback problem this should solve.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API or behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: compatibility
    attributes:
      label: Browser impact
      options:
        - Browser-independent
        - Requires MSE
        - Requires WebCodecs
        - Requires WASM
        - Requires a server or relay change
        - Unsure
    validations:
      required: true
